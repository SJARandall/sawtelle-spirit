<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sawtelle Spirit – Gaman</title>

    <!--
        Firefox normalisation: ensure camera stream has a known resolution
        so AR.js marker tracking is consistent. Must run before A-Frame loads.
    -->
    <script>
    (function normaliseFirefoxCamera() {
        if (!/firefox/i.test(navigator.userAgent)) return;
        const _gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = async function (constraints) {
            if (constraints && constraints.video && typeof constraints.video === 'object') {
                constraints.video.width  = constraints.video.width  || { ideal: 1280 };
                constraints.video.height = constraints.video.height || { ideal: 720  };
            }
            return _gum(constraints);
        };
    })();
    </script>

    <!-- AR.js 3.x + A-Frame 1.4.x (1.7.x has breaking changes AR.js has not caught up with) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        html { height: 100%; }
        body {
            margin: 0; padding: 0;
            height: 100%; height: -webkit-fill-available;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #arjs-loader {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 14px;
            color: #fff; font-size: 1.05em;
            text-align: center; padding: 20px;
        }
        #arjs-loader .spinner {
            width: 42px; height: 42px;
            border: 4px solid rgba(245,197,24,0.25);
            border-top-color: #f5c518;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a-scene {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
        }
        .a-canvas { width: 100% !important; height: 100% !important; }
        .a-enter-vr, .a-enter-ar { display: none !important; }
        #dialogue-section {
            position: fixed; bottom: 0; left: 0; width: 100%;
            min-height: 130px; max-height: 48%;
            background: #111; border-top: 3px solid #f5c518;
            color: #fff; padding: 14px 16px 16px;
            box-sizing: border-box;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 10;
        }
        .speech-bubble-wrapper {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
        }
        .speech-bubble {
            position: relative;
            background: #fef9e4; color: #1a1a1a;
            padding: 14px 22px;
            border: 3px solid #1a1a1a;
            border-radius: 18px;
            min-height: 56px;
            /* Creates room above the bubble for the upward tail */
            margin-top: 24px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; line-height: 1.45;
            font-size: clamp(13px, 3.5vw, 16px); font-weight: 700;
        }
        /* Centered upward-pointing tail — border triangle trick.
           ::before = dark outline triangle (larger, behind)
           ::after  = cream fill triangle (smaller, on top)
           Together they produce a bordered tail pointing at the AR scene above. */
        .speech-bubble::before, .speech-bubble::after {
            content: ''; position: absolute;
            width: 0; height: 0;
            border-style: solid; border-color: transparent;
            left: 50%; transform: translateX(-50%);
        }
        .speech-bubble::before {
            border-width: 0 14px 20px 14px;
            border-bottom-color: #1a1a1a;
            top: -23px;
        }
        .speech-bubble::after {
            border-width: 0 11px 17px 11px;
            border-bottom-color: #fef9e4;
            top: -19px;
        }
        #next-button {
            display: none; align-self: flex-end;
            background: #f5c518; color: #111;
            border: 3px solid #111; border-radius: 8px;
            padding: 8px 24px;
            font-size: clamp(14px, 3.5vw, 16px); font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0 #111;
            transition: transform 0.08s, box-shadow 0.08s;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }
        #next-button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111; }
        #marker-prompt {
            position: fixed; top: 16px; left: 50%;
            transform: translateX(-50%);
            background: #111; color: #f5c518;
            border: 2px solid #f5c518; border-radius: 8px;
            padding: 8px 18px; font-size: 13px; font-weight: 700;
            white-space: nowrap; z-index: 20;
            display: none; pointer-events: none;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="arjs-loader">
        <div class="spinner"></div>
        <div>Starting camera&hellip;<br><small style="opacity:.7;font-size:0.8em">Please allow camera access when prompted</small></div>
    </div>

    <div id="marker-prompt">&#128247; Point camera at the cat marker</div>

    <!--
        renderer: logarithmicDepthBuffer reduces z-fighting / flickering.
        detectionMode: mono_and_matrix runs both pattern and matrix scan passes,
          which improves real-world detection reliability on mobile.
        sourceWidth/Height: 1280x960 gives AR.js a high-res feed to analyse —
          critical for reliable PATT pattern matching (default is ~640px).
        maxDetectionRate: 30 caps processing at 30fps so each frame has more
          time to stabilise before analysis, reducing missed detections.
        smoothTolerance: 0.05 allows slightly more movement before re-averaging,
          which reduces jitter without noticeable lag.
    -->
    <a-scene embedded
             renderer="logarithmicDepthBuffer: true; colorManagement: true; precision: medium;"
             vr-mode-ui="enabled: false"
             arjs="sourceType: webcam;
                   detectionMode: mono_and_matrix;
                   sourceWidth: 1280;
                   sourceHeight: 960;
                   maxDetectionRate: 30;
                   smooth: true;
                   smoothCount: 8;
                   smoothTolerance: 0.05;
                   debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="neko-asset" src="3d/maneki-2.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient"     color="#ffffff" intensity="1.5"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1.0" position="1 2 1"></a-light>

        <a-marker type="pattern" url="cat-marker-2.patt" id="custom-marker">
            <a-entity
                id="neko-model"
                gltf-model="#neko-asset"
                scale="1 1 1"
                position="0 0 0"
                rotation="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <div id="dialogue-section">
        <div class="speech-bubble-wrapper">
            <div class="speech-bubble">
                <span id="speech-bubble-content"></span>
            </div>
        </div>
        <button id="next-button">Next</button>
    </div>

    <script>
    // =====================================================================
    //  CONFIGURATION
    //
    //  Chrome and Firefox require different rotation/position values because
    //  AR.js interprets the marker orientation differently in each browser.
    //
    //  Edit the values below to adjust the cat's rotation and position.
    // =====================================================================
    var DEFAULTS = {

        chrome: {
            rx:  0,      // X: tilt forward (+) / backward (-)
            ry: -90,     // Y: turn left (-) / right (+)  -- main facing direction
            rz:  90,     // Z: tilt sideways
            px:  0,      // X: shift left (-) / right (+)
            py: -1.5,    // Y: lift up (+) from marker surface
            pz: -0.25    // Z: move toward camera (-) / away (+)
        },

        firefox: {
            rx:  -35,     // X: tilt forward (+) / backward (-)
            ry: -90,    // Y: turn left (-) / right (+)
            rz:  85,     // Z: tilt sideways
            px:  -0.6,   // X: shift left (-) / right (+)
            py: -1.5,    // Y: lift up (+) from marker surface
            pz:  0       // Z: move toward camera (-) / away (+)
        },

        // Auto-scale: resize the model so its tallest dimension equals
        // targetHeight in marker units.  Set autoScale: false to use the
        // model's native size.
        autoScale:    true,
        targetHeight: 1
    };
    // =====================================================================

    window.addEventListener('load', function () {

        var isFirefox = /firefox/i.test(navigator.userAgent);
        var BROWSER   = isFirefox ? 'firefox' : 'chrome';

        var cfg = Object.assign({}, DEFAULTS[BROWSER]);

        // -- DOM refs --
        var bubbleText   = document.getElementById('speech-bubble-content');
        var nextButton   = document.getElementById('next-button');
        var markerPrompt = document.getElementById('marker-prompt');
        var loader       = document.getElementById('arjs-loader');
        var customMarker = document.getElementById('custom-marker');
        var modelEntity  = document.getElementById('neko-model');
        var sceneEl      = document.querySelector('a-scene');

        // -- Dialogue --
        // Lines are loaded from intro-dialogue.json so you can edit the text
        // without touching this file.
        var dialogueLines = [];
        var finalUrl    = 'https://sawtelleja.org/ss/ss-map-tensho.html';
        var currentLine = 0;
        var lastLine    = 0;
        var markerSeen  = false;

        function updateDialogue() {
            bubbleText.textContent = dialogueLines[currentLine];
            nextButton.textContent = (currentLine === lastLine) ? 'Continue Story' : 'Next';
        }

        function showNextButton() {
            nextButton.style.display = 'flex';
            markerPrompt.style.display = 'none';
        }

        function applyTransform() {
            if (!modelEntity) return;
            modelEntity.setAttribute('rotation', { x: cfg.rx, y: cfg.ry, z: cfg.rz });
            modelEntity.setAttribute('position', { x: cfg.px, y: cfg.py, z: cfg.pz });
        }

        // -- Load dialogue then init --
        fetch('ss-token-gaman.json')
            .then(function (r) { return r.json(); })
            .then(function (lines) {
                dialogueLines = lines;
                lastLine      = lines.length - 1;
                updateDialogue();
                markerPrompt.style.display = 'block';
            })
            .catch(function (err) {
                console.error('Could not load JSON:', err);
                bubbleText.textContent = 'Error loading dialogue. Please refresh.';
            });

        // -- Loader --
        if (sceneEl) {
            sceneEl.addEventListener('loaded', function () { loader.style.display = 'none'; });
        }
        setTimeout(function () { loader.style.display = 'none'; }, 6000);

        // -- Model loaded: auto-scale then apply transform --
        if (modelEntity) {
            modelEntity.addEventListener('model-loaded', function () {

                if (!DEFAULTS.autoScale) {
                    applyTransform();
                    return;
                }

                var obj3d = modelEntity.object3D;
                obj3d.updateMatrixWorld(true);
                var mesh = modelEntity.getObject3D('mesh');
                if (!mesh) { applyTransform(); return; }

                try {
                    var box  = new THREE.Box3().setFromObject(mesh);
                    var size = new THREE.Vector3();
                    box.getSize(size);
                    var maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0) {
                        var sf = DEFAULTS.targetHeight / maxDim;
                        obj3d.scale.set(sf, sf, sf);
                        modelEntity.setAttribute('scale', { x: sf, y: sf, z: sf });
                    }
                } catch (err) {
                    console.warn('Auto-scale failed:', err);
                }

                applyTransform();

            }, { once: true });

            modelEntity.addEventListener('model-error', function (evt) {
                console.error('Model failed to load:', evt.detail && evt.detail.message);
            }, { once: true });
        }

        // -- Marker events --
        if (customMarker) {
            customMarker.addEventListener('markerFound', function () {
                if (!markerSeen) {
                    markerSeen = true;
                    showNextButton();
                }
                // Re-apply every detection in case AR.js reset the transform.
                applyTransform();
            });
        }

        // -- Next button --
        nextButton.addEventListener('click', function () {
            if (currentLine === lastLine) {
                window.location.href = finalUrl;
            } else {
                currentLine++;
                updateDialogue();
            }
        });

    }); // end window.load
    </script>

</body>
</html>
